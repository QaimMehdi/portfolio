
# Netlify Configuration for Performance Optimization

# Redirects
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = false

# Preload critical assets - Hero background image (loads first)
[[headers]]
  for = "/src/assets/herobg.png"
  [headers.values]
    Link = "</src/assets/herobg.png>; rel=preload; as=image"

# Preload 3D models - Desktop PC scene
[[headers]]
  for = "/desktop_pc/scene.gltf"
  [headers.values]
    Link = "</desktop_pc/scene.gltf>; rel=preload; as=fetch"

# Preload 3D models - Planet scene
[[headers]]
  for = "/planet/scene.gltf"
  [headers.values]
    Link = "</planet/scene.gltf>; rel=preload; as=fetch"

# Cache 3D models for a year
[[headers]]
  for = "/*.gltf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache textures for 3D models
[[headers]]
  for = "/desktop_pc/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/planet/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache PNG/JPG images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache AVIF images
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache compiled assets (JS/CSS)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Enable compression for text-based assets
[[headers]]
  for = "/"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
