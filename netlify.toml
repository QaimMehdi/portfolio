# Netlify Configuration for Optimal Performance
# Focus: Reduce LCP, TBT, and maximize Core Web Vitals

[build]
  command = "npm run build"
  publish = "dist"
  
# Environment variables for build
[build.environment]
  # Ensure devDependencies are installed (vite is a devDependency)
  npm_config_legacy_peer_deps = "true"
  CI = "false"
  NODE_ENV = "development"
  
# Serverless functions configuration
[functions]
  directory = "netlify/functions"

# Production context with proper env vars
[context.production]
  command = "npm run build"
  environment = { NODE_ENV = "production", CI = "false" }

# ============================================================================
# CACHING STRATEGY - Aggressive for production
# ============================================================================

# HTML - Short cache, must revalidate for fresh content
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# JavaScript & CSS - Long cache since they're hashed
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# ============================================================================
# COMPRESSION - Enable all formats for maximum efficiency
# ============================================================================

# Gzip and Brotli compressed versions
[[headers]]
  for = "*.js"
  [headers.values]
    Content-Encoding = "gzip, br"

[[headers]]
  for = "*.css"
  [headers.values]
    Content-Encoding = "gzip, br"

[[headers]]
  for = "*.svg"
  [headers.values]
    Content-Encoding = "gzip, br"

# ============================================================================
# 3D MODEL OPTIMIZATION - Critical for performance
# ============================================================================

# Desktop PC Models - Optimize for hero section (critical)
[[headers]]
  for = "/desktop_pc/scene.gltf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf+json; charset=utf-8"
    Content-Encoding = "gzip, br"
    # Enable range requests for resumable downloads on slow connections
    Accept-Ranges = "bytes"

# Desktop PC Data - Binary 3D mesh data
[[headers]]
  for = "/desktop_pc/scene.data"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip, br"
    Accept-Ranges = "bytes"

# Planet Model - Non-critical, can have slightly shorter cache during dev
[[headers]]
  for = "/planet/scene.gltf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf+json; charset=utf-8"
    Content-Encoding = "gzip, br"
    Accept-Ranges = "bytes"

# Planet Data
[[headers]]
  for = "/planet/scene.data"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip, br"
    Accept-Ranges = "bytes"

# All GLTF Models - Long cache since they're immutable
[[headers]]
  for = "*.gltf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "model/gltf+json; charset=utf-8"
    Content-Encoding = "gzip, br"

# Binary 3D Data Files - CRITICAL OPTIMIZATION
[[headers]]
  for = "*.data"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
    Content-Encoding = "gzip, br"

# Desktop PC 3D Model Textures
[[headers]]
  for = "/desktop_pc/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip, br"

# Planet Textures
[[headers]]
  for = "/planet/textures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip, br"

# ============================================================================
# IMAGE OPTIMIZATION - Reduce data transfer
# ============================================================================

# PNG Images
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip, br"

# JPEG Images
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip, br"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Encoding = "gzip, br"

# AVIF Images (modern format, smallest)
[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "image/avif"
    Content-Encoding = "gzip, br"

# ============================================================================
# HTTP/2 PUSH & PRELOAD - Speed up critical asset delivery
# ============================================================================

# Push critical CSS (Tailwind compiled)
[[headers]]
  for = "/"
  [headers.values]
    Link = "</assets/index.css>; rel=preload; as=style"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ============================================================================
# REDIRECTS
# ============================================================================

[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = false
